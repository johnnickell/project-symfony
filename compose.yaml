services:
  api:
    build:
      context: ./etc/docker/fpm
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    restart: unless-stopped
    tty: true
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/php-fpm.pid && kill -0 $$(cat /tmp/php-fpm.pid)"]
      interval: 2s
      timeout: 2s
      retries: 15
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: dev-only-secret
    volumes:
      - ./:/app
      - ./etc/docker/fpm/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network

  server:
    build: ./etc/docker/nginx
    ports:
      - "${HTTP_PORT:-18083}:80"
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/app
      - ./etc/docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy

networks:
  app-network:
    driver: bridge
    labels:
      project-symfony.checkout: "${PROJECT_SYMFONY_CHECKOUT:-${PWD}}"
